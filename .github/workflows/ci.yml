name: CI

# FE chưa có test runner nên CI chỉ làm được 2 việc chắc chắn có giá trị:
#  - typecheck: bắt lỗi type trước khi merge (đã có lần lọt lỗi chỉ vì build cục bộ bị bỏ qua)
#  - build: bắt lỗi chỉ xuất hiện khi Next build (server/client boundary, route config, ...)
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  typecheck-and-build:
    name: Typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # `next build` cần các biến NEXT_PUBLIC_*; thiếu thì build lỗi hoặc tạo bundle sai.
      # Đây là giá trị giả, chỉ để build chạy được.
      - name: Build
        # 4 biến này là bắt buộc theo src/config.ts (throw nếu thiếu), nên phải khai báo đủ.
        env:
          NEXT_PUBLIC_API_ENDPOINT: http://localhost:4000
          NEXT_PUBLIC_URL: http://localhost:3000
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ci-dummy-client-id
          NEXT_PUBLIC_GOOGLE_AUTHORIZED_REDIRECT_URI: http://localhost:3000/auth/login/google
        run: npm run build
